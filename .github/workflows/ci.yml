name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # The suite is fully offline: SQLite + a stubbed LLM, so no secrets are needed.
  LLM_PROVIDER: stub

jobs:
  quality:
    name: Lint, type-check and test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,frontend]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (mypy)
        run: mypy app scripts frontend

      - name: Test (pytest + coverage)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  migrations:
    name: Alembic migrations against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tutor
          POSTGRES_PASSWORD: tutor
          POSTGRES_DB: tutor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tutor -d tutor"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://tutor:tutor@localhost:5432/tutor

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Upgrade, downgrade and upgrade again
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Verify the migration matches the ORM models
        run: |
          # Autogenerate must produce an empty diff, otherwise a model change
          # was committed without a migration.
          alembic check

      - name: Seed demo data through the service layer
        run: python scripts/seed_demo.py

  docker:
    name: Docker stack builds and answers a question
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Start the stack (db + api + ui)
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Smoke-test the API
        run: |
          curl -fsS http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
          TOKEN=$(curl -fsS -X POST http://localhost:8000/auth/token \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci","password":"homework"}' \
            | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          CONV=$(curl -fsS -X POST http://localhost:8000/conversations \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' \
            | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -fsS -X POST "http://localhost:8000/conversations/$CONV/messages" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"content":"What is 17 * 23? Please show the working."}' \
            | grep -q '"answer_status":"verified"'
          # History must survive the request that created it.
          curl -fsS "http://localhost:8000/conversations/$CONV" \
            -H "Authorization: Bearer $TOKEN" | grep -q '"message_count":2'

      - name: Smoke-test the SSE endpoint
        run: |
          TOKEN=$(curl -fsS -X POST http://localhost:8000/auth/token \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci","password":"homework"}' \
            | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          CONV=$(curl -fsS -X POST http://localhost:8000/conversations \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' \
            | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -fsS -N -X POST "http://localhost:8000/conversations/$CONV/messages/stream" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"content":"What is 15% of 240? Please show the working."}' \
            | tee /tmp/stream.txt | head -40
          grep -q 'event: step' /tmp/stream.txt
          grep -q 'event: done' /tmp/stream.txt

      - name: Smoke-test the Streamlit frontend
        run: curl -fsS http://localhost:8501/_stcore/health | grep -q ok

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
