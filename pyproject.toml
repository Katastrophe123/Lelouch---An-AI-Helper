[project]
name = "ai-homework-helper"
version = "3.0.0"
description = "Lelouch: a Claude Agent SDK assistant (research, browser, MCP, your documents) plus a self-checking LangGraph tutor, behind FastAPI + PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KanishK" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.50",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "pyjwt>=2.9",
    "sse-starlette>=2.1",
    "structlog>=24.4",
    # Agent mode
    "claude-agent-sdk>=0.2.170",
    # Knowledge base
    "pgvector>=0.5",
    "fastembed>=0.9",
    "pypdf>=6.0",
    "python-docx>=1.2",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
frontend = [
    "streamlit>=1.40",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "T20", "SIM", "RET", "C4"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
"scripts/*" = ["T20"]
"frontend/*" = ["T20"]
"alembic/*" = ["E501"]

[tool.mypy]
# 3.12: numpy (via pgvector/fastembed) ships stubs using 3.12 syntax. The
# runtime floor is still 3.11 (ruff target-version, CI matrix).
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
strict_equality = true
exclude = ["alembic/versions/", "^legacy/", "^build/"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "streamlit.*", "sse_starlette.*", "scripts.*", "pgvector.*", "fastembed.*", "docx.*"]
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["app"]
